name: Reference visual inspection (temporary)
on:
  push:
    paths:
      - '.github/workflows/reference-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Capture public reference views
        run: |
          npm install --no-save playwright@1.56.1
          cat > /tmp/capture.cjs <<'JS'
          const {chromium}=require(process.env.GITHUB_WORKSPACE+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:950},deviceScaleFactor:1, reducedMotion:'reduce'});
            await page.goto('https://prajwel.github.io/',{waitUntil:'networkidle',timeout:30000});
            await page.waitForTimeout(500);
            console.log('PAGE_TITLE',await page.title());
            console.log('BUTTONS',JSON.stringify(await page.locator('button').allTextContents()));
            console.log('CONTENT',JSON.stringify((await page.locator('body').innerText()).slice(0,4500)));
            const tabs=['Earth','Moon','Sun','Galaxy','Universe'];
            for(const tab of tabs){
              await page.getByRole('button',{name:tab,exact:true}).first().click();
              await page.waitForTimeout(400);
              const p=await page.screenshot({type:'jpeg',quality:61,animations:'disabled'});
              console.log('VIEW_'+tab+'_START');
              console.log(p.toString('base64'));
              console.log('VIEW_'+tab+'_END');
              console.log('VIEW_'+tab+'_TEXT',JSON.stringify((await page.locator('body').innerText()).slice(0,1800)));
            }
            await browser.close();
          })().catch(err=>{console.log('ERROR',err.stack);process.exitCode=1});
          JS
          node /tmp/capture.cjs
