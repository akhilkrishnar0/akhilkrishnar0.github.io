name: Temporary interaction audit
on:
  push:
    paths: ['.github/workflows/interaction-audit.yml']
permissions: { contents: read }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect rendered reference structure and geometry
        run: |
          BROWSER=$(command -v google-chrome)
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=7000 --dump-dom 'https://prajwel.github.io/' > /tmp/prajwel-dom.html 2>/dev/null
          python3 - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self):super().__init__();self.stack=[];self.text='';self.marks=[];self.tags={}
            def handle_starttag(self,t,a):
              d=dict(a);self.stack.append((t,d))
              if t in ('h1','h2','h3','h4','section','main','article','nav','header','footer','canvas'):
                print('EL',t,{x:d.get(x,'')[:140] for x in ['id','class','style'] if d.get(x)},'at_depth',len(self.stack))
            def handle_endtag(self,t):
              for n in range(len(self.stack)-1,-1,-1):
                if self.stack[n][0]==t:self.stack=self.stack[:n];return
            def handle_data(self,s):
              s=s.strip()
              if len(s)>13 and any(x[0] in ('h1','h2','h3','h4','button') for x in self.stack): print('TEXT',s[:180])
          data=open('/tmp/prajwel-dom.html').read()
          print('RENDERED_BYTES',len(data))
          P().feed(data)
          PY
